[workspace]
resolver = "2"
members  = [
    "crates/bot",
    "crates/backtest",
]

[workspace.dependencies]
# Ethereum
alloy = { version = "0.9", features = [
    "full",
    "node-bindings",     # spawn Anvil from Rust
] }

# Async
tokio        = { version = "1", features = ["full"] }
futures      = "0.3"
futures-util = "0.3"

# Serialisation
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Crypto (for Flashbots signature)
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hex  = "0.4"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config / Errors
dotenvy = "0.15"
eyre    = "0.6"
thiserror = "1"
clap      = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto       = "thin"
codegen-units = 1
