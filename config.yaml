# ============================================================
#  Crypto News Bot — конфигурация
# ============================================================

coins:
  - BTC
  - ETH

# ────────────────────────────────────────────────────────────
#  Данные
# ────────────────────────────────────────────────────────────
data:
  # Сгенерированные тестовые данные (быстро, всегда работает)
  news_file:   "data/sample_news.csv"
  prices_file: "data/sample_prices.csv"

  # Реальные данные — запусти data/fetch_real_data.py чтобы получить
  # news_file:   "data/real_news.csv"
  # prices_file: "data/real_prices.csv"

# ────────────────────────────────────────────────────────────
#  Выбор анализатора
#  Варианты: "cryptobert" | "keyword" | "ensemble"
# ────────────────────────────────────────────────────────────
analyzer: "ensemble"

# ────────────────────────────────────────────────────────────
#  CryptoBERT (ML-анализатор)
# ────────────────────────────────────────────────────────────
model:
  name: "ElKulako/cryptobert"     # HuggingFace model id
  inference_latency_ms: 100       # симулируемая задержка инференса (мс)
  network_latency_ms: 50          # симулируемая сетевая задержка (мс)

# ────────────────────────────────────────────────────────────
#  Keyword анализатор (наш rule-based)
# ────────────────────────────────────────────────────────────
keyword_analyzer:
  buy_threshold: 1           # min перевес bullish слов для BUY (в штуках)
  sell_threshold: 1          # min перевес bearish слов для SELL
  ticker_match_bonus: 0.10   # бонус за упоминание тикера в тексте
  latency_ms: 10             # симулируемая задержка (мс)

  # Дополнительные слова к стандартному словарю (опционально)
  extra_bullish_words: []
  extra_bearish_words: []

# ────────────────────────────────────────────────────────────
#  Ensemble (комбинация анализаторов)
#  strategy: weighted_vote | majority | any_signal | all_agree
# ────────────────────────────────────────────────────────────
ensemble:
  strategy: "weighted_vote"
  weights:
    cryptobert: 0.65    # ML-модель — более высокий вес
    keyword: 0.35       # keyword — вспомогательный

# ────────────────────────────────────────────────────────────
#  Торговля
# ────────────────────────────────────────────────────────────
trading:
  initial_capital: 10000.0        # начальный капитал в USD
  position_size_pct: 0.10         # доля капитала на одну сделку (10 %)
  buy_threshold: 0.60             # мин. уверенность для BUY
  sell_threshold: 0.60            # мин. уверенность для SELL

# ────────────────────────────────────────────────────────────
#  Логирование
# ────────────────────────────────────────────────────────────
logging:
  level: "INFO"                   # DEBUG | INFO | WARNING | ERROR
